version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:latest
    container_name: lms-database
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - lms-network

  # Express Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lms-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/lms_db
      - JWT_SECRET=supersecretkey123
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongo
    networks:
      - lms-network

  # React Frontend (Node + Vite)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lms-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    depends_on:
      - server
    networks:
      - lms-network

volumes:
  mongo-data:

networks:
  lms-network:
    driver: bridge
